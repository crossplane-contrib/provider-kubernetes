# Note: This example delivers a value from a Secret to the target object
# without storing it in the Object. It requires the provider to be started
# with the --sanitize-secrets flag, see docs/sanitize-secrets.md.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: foo-sanitized
  namespace: default
  annotations:
    # An Object reconciled without --sanitize-secrets stores the values it
    # reads from Secrets. The provider runs without the flag by default, so
    # the MR is created as paused. The hook enables the flag in the provider,
    # then unpauses the MR to ensure it is first reconciled with the flag.
    uptest.upbound.io/pre-assert-hook: testhooks/enable-sanitize-secrets.sh
    crossplane.io/paused: "true"
    uptest.upbound.io/post-assert-hook: testhooks/validate-sanitize-secrets.sh
    uptest.upbound.io/timeout: "60"
spec:
  # Watch the referenced Secret, so that a new value is applied right away.
  watch: true
  references:
  # With --sanitize-secrets, a value patched from a v1 Secret is applied to
  # the target object only. Both apiVersion and kind must be set, as they
  # default to Object.
  - patchesFrom:
      apiVersion: v1
      kind: Secret
      name: bar-sanitized
      namespace: default
      fieldPath: data.password
    toFieldPath: data.password
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        namespace: default
      type: Opaque
  providerConfigRef:
    kind: ClusterProviderConfig
    name: kubernetes-provider
---
apiVersion: v1
kind: Secret
metadata:
  name: bar-sanitized
  namespace: default
stringData:
  password: sample-password
