apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: kubernetes-provider
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: cluster-config
      key: kubeconfig
  identity:
    type: CoreWeaveAPIToken
    source: Secret
    secretRef:
      name: coreweave-credentials
      namespace: crossplane-system
      key: credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-config
  namespace: crossplane-system
type: Opaque
stringData:
  # Only the cluster's API server endpoint is needed. The user entry is left
  # empty: the CoreWeave API token from the identity Secret is used instead.
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://<CKS_API_SERVER_ENDPOINT>
      name: cks-cluster
    contexts:
    - context:
        cluster: cks-cluster
        user: cks-user
      name: cks-context
    current-context: cks-context
    users:
    - name: cks-user
      user: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: coreweave-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  # Same format as provider-coreweave's credentials, so one Secret can serve
  # both providers.
  credentials: |
    {"token": "<COREWEAVE_API_TOKEN>"}
